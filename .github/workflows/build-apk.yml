name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable was not found in PATH."
            exit 1
          fi

          java -version

          VERSION_OUTPUT="$(java -version 2>&1)"
          RAW_VERSION="$(echo "$VERSION_OUTPUT" | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d. -f2)"
          else
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d. -f1 | sed 's/[^0-9].*//')"
          fi

          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but Java $MAJOR_VERSION was detected."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            KEYTOOL_BIN="$(command -v keytool || true)"
          fi
          if [ -z "$KEYTOOL_BIN" ]; then
            echo "::error::keytool from the configured Java 17 installation could not be found."
            exit 1
          fi

          if [ -f ./debug.keystore ]; then
            echo "Debug keystore already exists at ./debug.keystore; skipping generation."
          elif [ -f ./debug.keystore.base64 ]; then
            base64 -d ./debug.keystore.base64 > ./debug.keystore
            echo "Restored registered debug keystore from ./debug.keystore.base64."
          else
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "::error::Failed to prepare debug keystore at ./debug.keystore."
            exit 1
          fi
          echo "Debug keystore ready."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK was not found at $EXPECTED_APK."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK exists but is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Cannot prepare release asset because $EXPECTED_APK is missing or empty."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\+/-/g; s/^-//; s/-$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_STAGE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          RELEASE_ASSET_PATH="${RELEASE_STAGE_DIR}/${RELEASE_ASSET_NAME}"

          cp "$EXPECTED_APK" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Failed to stage release asset at $RELEASE_ASSET_PATH."
            exit 1
          fi

          echo "asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${RELEASE_ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: "Debug APK Build #${{ github.run_number }}"
          TARGET_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset '$ASSET_PATH' is missing, empty, or not an .apk file."
            exit 1
          fi

          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")"
          printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **GitHub Actions Run Number:** ${RUN_NUMBER}" \
            "- **GitHub Actions Run Attempt:** ${RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${TARGET_SHA}" \
            "- **Intended Use:** Testing on Android devices" \
            "- **Release Type:** Not a Play Store production release" \
            "- **Signing:** Signed only with a temporary debug keystore" \
            > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: "Debug APK Build #${{ github.run_number }}"
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Release APK Asset: $ASSET_NAME"
            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Status:** APK built, artifact uploaded, and GitHub Release published."
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release URL:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "Download \`${ASSET_NAME}\` directly from the **Assets** section on the GitHub Release page above."
              echo "The normal GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed. No GitHub Release URL was created."
              echo ""
              echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Download:** Download the GitHub Actions artifact named \`app-debug-apk\` from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
