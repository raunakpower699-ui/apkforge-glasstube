name: ApkForge Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p apkforge-out
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -path "*/outputs/apk/*.apk" -o -path "*/outputs/apk/*/*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced by Gradle build"
            exit 1
          fi
          cp "$APK_PATH" apkforge-out/app-debug.apk
          ls -lh apkforge-out/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glasstube-apk
          path: apkforge-out/app-debug.apk

      - name: Publish Direct APK Download Link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}-${{ github.run_attempt }}" \
            apkforge-out/app-debug.apk \
            --title "GlassTube APK #${{ github.run_number }}" \
            --notes "Compiled by ApkForge Cloud Builder from commit ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            --latest