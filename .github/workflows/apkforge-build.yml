name: ApkForge Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p apkforge-out
          APK_PATH=$(find . -path "*/outputs/apk/*.apk" -o -path "*/outputs/apk/*/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced by Gradle build"
            exit 1
          fi
          cp "$APK_PATH" apkforge-out/app-debug.apk
          ls -lh apkforge-out/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glasstube-apk
          path: apkforge-out/app-debug.apk

      - name: Publish Direct APK Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "GlassTube APK #${{ github.run_number }}"
          body: "Compiled by ApkForge Cloud Builder from commit ${{ github.sha }}"
          files: apkforge-out/app-debug.apk